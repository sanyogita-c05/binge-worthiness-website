<!doctype html>
<html>
<head>
  <title>Personalized Binge Score</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">

  <style>
    body {
      background: #0f172a;
      color: #ffffff;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
    }

    .form-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 60px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 25px;
      color: #38bdf8;
    }

    .form-card {
      background: #1e293b;
      padding: 30px;
      border-radius: 12px;
      width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    label {
      font-size: 14px;
      color: #cbd5f5;
    }

    input, select {
      padding: 10px;
      border-radius: 8px;
      border: none;
      outline: none;
      font-size: 14px;
      background: #334155;
      color: white;
    }

    select {
      height: 100px;
    }

    input:focus, select:focus {
      border: 1px solid #38bdf8;
    }

    button {
      margin-top: 10px;
      padding: 12px;
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s ease;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px rgba(56,189,248,0.5);
    }
  </style>

</head>

<body>

<div id="navbar"></div>

<section class="form-section">

  <h1>👤 Personalized Binge Score</h1>

  <form action="/personalized_result" method="POST" class="form-card">

    <label>🎬 Movie / Series</label>
    <input type="text" name="movie" required>

    <label>🎭 Favorite Genres</label>
    <select name="genres" multiple>
      <option>Drama</option>
      <option>Thriller</option>
      <option>Comedy</option>
      <option>Romance</option>
      <option>Action</option>
      <option>Crime</option>
    </select>

    <label>😊 Mood</label>
    <select name="mood">
      <option>Thriller</option>
      <option>Romance</option>
      <option>Comedy</option>
      <option>Dark</option>
      <option>Feel-good</option>
    </select>

    <label>⏱ Available Time (hrs)</label>
    <input type="number" name="time" step="0.5" required>

    <button type="submit">Get Personalized Score 🚀</button>

  </form>

</section>

<script src="{{ url_for('static', filename='js/navbar.js') }}"></script>

</body>
</html>
