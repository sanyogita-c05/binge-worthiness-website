<!doctype html>
<html>
  <head>
    <title>Dashboard</title>

    <!-- CSS -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/global.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/dashboard.css') }}"
    />
  </head>

  <body>
    <div id="navbar"></div>

    <section class="dashboard">
      <div class="card-container">
        <div class="feature-card" onclick="goTo('score')">
          <span class="icon">🎯</span>
          <h3>Binge Score</h3>
        </div>

        <div class="feature-card" onclick="goTo('personalized')">
          <span class="icon">👤</span>
          <h3>Personalized</h3>
        </div>

        <div class="feature-card" onclick="goTo('trends')">
          <span class="icon">📈</span>
          <h3>Trends</h3>
        </div>

        <div class="feature-card" onclick="goTo('time_page')">
          <span class="icon">⏳</span>
          <h3>Time Calculator</h3>
        </div>

        <div class="feature-card" onclick="goTo('mood_page')">
          <span class="icon">🧠</span>
          <h3>Mood Based</h3>
        </div>

        <div class="feature-card" onclick="goTo('analytics')">
          <span class="icon">📊</span>
          <h3>Analytics</h3>
        </div>
      </div>
    </section>

    <!-- JS -->
    <script src="{{ url_for('static', filename='js/navbar.js') }}"></script>

    <script>
      function goTo(route) {
        window.location.href = "/" + route;
      }
    </script>
  </body>
</html>
