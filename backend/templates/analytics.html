<!doctype html>
<html>
<head>
  <title>Analytics Dashboard</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/analytics.css') }}">

  <style>
    .dashboard {
      padding: 30px;
      text-align: center;
    }

    .chart-selector button {
      padding: 10px 20px;
      margin: 5px;
      border-radius: 8px;
      border: none;
      background: #444;
      color: white;
      cursor: pointer;
    }

    .chart-selector button.active {
      background: #00c3ff;
      color: black;
    }
  </style>
</head>

<body>

<div id="navbar"></div>

<section class="dashboard">
  <h1>📊 Visual Analytics Dashboard</h1>

  <!-- Buttons -->
  <div class="chart-selector">
    <button onclick="loadChart('Sheet1', this)">Binge</button>
    <button onclick="loadChart('Sheet2', this)">Genre</button>
    <button onclick="loadChart('Sheet3', this)">Engagement</button>
    <button onclick="loadChart('Sheet4', this)">Ratings</button>
    <button onclick="loadChart('Sheet5', this)">Votes</button>
  </div>

  <!-- Tableau Container -->
  <div id="tableauViz"></div>

</section>

<script src="{{ url_for('static', filename='js/navbar.js') }}"></script>

<script>
function loadChart(sheetName, btn) {

    // Clear previous chart
    const container = document.getElementById("tableauViz");
    container.innerHTML = "";

    // Create placeholder
    const div = document.createElement("div");
    div.className = "tableauPlaceholder";

    const obj = document.createElement("object");
    obj.className = "tableauViz";

    obj.innerHTML = `
      <param name="host_url" value="https://public.tableau.com/" />
      <param name="embed_code_version" value="3" />
      <param name="name" value="BingeScore1/${sheetName}" />
      <param name="tabs" value="no" />
      <param name="toolbar" value="yes" />
    `;

    div.appendChild(obj);
    container.appendChild(div);

    // Load Tableau script
    const script = document.createElement("script");
    script.src = "https://public.tableau.com/javascripts/api/viz_v1.js";
    obj.parentNode.insertBefore(script, obj);

    // Button highlight
    document.querySelectorAll(".chart-selector button")
        .forEach(b => b.classList.remove("active"));

    btn.classList.add("active");
}

// Load default chart
window.onload = () => {
    loadChart("Sheet1", document.querySelector(".chart-selector button"));
};
</script>

</body>
</html>
