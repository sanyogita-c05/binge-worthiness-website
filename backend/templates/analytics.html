<!doctype html>
<html>
<head>
  <title>Analytics Dashboard</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/analytics.css') }}">

  <style>
    .dashboard {
      padding: 30px;
      text-align: center;
    }

    .tableau-container {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #tableauViz {
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .chart-buttons button {
      padding: 10px 20px;
      margin: 5px;
      border-radius: 8px;
      border: none;
      background: #444;
      color: white;
      cursor: pointer;
    }

    .chart-buttons button.active {
      background: #00c3ff;
      color: black;
    }
  </style>
</head>

<body>

<div id="navbar"></div>

<section class="dashboard">
  <h1>📊 Analytics Dashboard</h1>

  <!-- Buttons -->
  <div class="chart-buttons">
    <button onclick="loadGraph('graph1', this)" class="active">
      Binge Score Distribution
    </button>

    <button onclick="loadGraph('graph2', this)">
      Genre vs Binge Category
    </button>

    <button onclick="loadGraph('graph3', this)">
      Rating vs Binge Score
    </button>

    <button onclick="loadGraph('graph4', this)">
      Popularity vs Binge Score
    </button>
  </div>

  <!-- Tableau Container -->
  <div class="tableau-container">
    <div id="tableauViz"></div>
  </div>

</section>

<script src="{{ url_for('static', filename='js/navbar.js') }}"></script>

<script>
function loadGraph(graph, btn) {

    const container = document.getElementById("tableauViz");
    container.innerHTML = "";

    const div = document.createElement("div");
    div.className = "tableauPlaceholder";
    div.style.width = "1000px";
    div.style.height = "600px";

    const obj = document.createElement("object");
    obj.className = "tableauViz";
    obj.width = "100%";
    obj.height = "100%";

    let graphName = "";

    if (graph === 'graph1') {
        graphName = "Graph1_17778884039160/Sheet1";
    } 
    else if (graph === 'graph2') {
        graphName = "genreVsTitle/Sheet1?publish=yes";
    }
    else if (graph === 'graph3') {
        graphName = "Graph3_17778930016930/Sheet4";
    }
    else if (graph === 'graph4') {
        graphName = "Graph4_17778941892200/Sheet5";
    }

    obj.innerHTML = `
      <param name="host_url" value="https://public.tableau.com/" />
      <param name="embed_code_version" value="3" />
      <param name="name" value="${graphName}" />
      <param name="tabs" value="no" />
      <param name="toolbar" value="yes" />
    `;

    div.appendChild(obj);
    container.appendChild(div);

    const script = document.createElement("script");
    script.src = "https://public.tableau.com/javascripts/api/viz_v1.js";
    obj.parentNode.insertBefore(script, obj);

    // Button active state
    document.querySelectorAll(".chart-buttons button")
        .forEach(b => b.classList.remove("active"));

    btn.classList.add("active");
}

// Load first graph by default
window.onload = () => {
    loadGraph('graph1', document.querySelector(".chart-buttons button"));
};
</script>

</body>
</html>
