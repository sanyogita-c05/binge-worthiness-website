<!doctype html>
<html>
  <head>
    <title>Time Calculator – BingeWise</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">

    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --red: #E63333;
        --bg: #0a0a0a;
        --bg2: #141414;
        --bg3: #1e1e1e;
        --border: rgba(255,255,255,0.08);
        --text: #f0f0f0;
        --muted: #888;
        --font-display: 'Bebas Neue', sans-serif;
        --font-body: 'DM Sans', sans-serif;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-body);
        min-height: 100vh;
        overflow-x: hidden;
      }

      nav {
        position: fixed;
        top: 0; left: 0; right: 0;
        z-index: 100;
        padding: 0 2.5rem;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: linear-gradient(to bottom, rgba(10,10,10,0.98), transparent);
        border-bottom: 0.5px solid var(--border);
      }

      .nav-brand {
        font-family: var(--font-display);
        font-size: 1.7rem;
        letter-spacing: 0.03em;
        color: var(--red);
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .nav-links {
        display: flex;
        gap: 2rem;
        list-style: none;
      }

      .nav-links a {
        color: var(--muted);
        text-decoration: none;
        font-size: 0.9rem;
        letter-spacing: 0.04em;
        transition: color 0.2s;
      }

      .nav-links a:hover { color: var(--text); }

      .hero-bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
      }

      .hero-bg::before {
        content: '';
        position: absolute;
        top: -20%; left: -10%;
        width: 600px; height: 600px;
        background: radial-gradient(circle, rgba(230,51,51,0.12) 0%, transparent 70%);
        animation: pulse 8s ease-in-out infinite;
      }

      .hero-bg::after {
        content: '';
        position: absolute;
        bottom: 10%; right: -5%;
        width: 400px; height: 400px;
        background: radial-gradient(circle, rgba(230,51,51,0.07) 0%, transparent 70%);
        animation: pulse 10s ease-in-out infinite reverse;
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.15); opacity: 0.7; }
      }

      main {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 6rem 1.5rem 4rem;
      }

      .calc-card {
        width: 100%;
        max-width: 520px;
        background: var(--bg2);
        border: 0.5px solid var(--border);
        border-radius: 20px;
        padding: 3rem 2.5rem;
        animation: fadeUp 0.6s ease both;
      }

      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(28px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      .icon-badge {
        width: 60px; height: 60px;
        border-radius: 16px;
        background: rgba(230,51,51,0.12);
        border: 1px solid rgba(230,51,51,0.25);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.6rem;
        margin-bottom: 1.5rem;
      }

      .calc-card h1 {
        font-family: var(--font-display);
        font-size: 2.8rem;
        letter-spacing: 0.04em;
        line-height: 1;
        margin-bottom: 0.5rem;
      }

      .calc-card h1 span { color: var(--red); }

      .calc-card p {
        font-size: 0.92rem;
        color: var(--muted);
        font-weight: 300;
        margin-bottom: 2rem;
        line-height: 1.5;
      }

      .divider {
        height: 0.5px;
        background: var(--border);
        margin-bottom: 2rem;
      }

      label.field-label {
        display: block;
        font-size: 0.78rem;
        font-weight: 500;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 0.6rem;
      }

      .input-wrap {
        position: relative;
        margin-bottom: 1.5rem;
      }

      .input-wrap svg {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--muted);
        width: 18px; height: 18px;
        pointer-events: none;
      }

      input[type="number"] {
        width: 100%;
        height: 52px;
        background: var(--bg3);
        border: 0.5px solid var(--border);
        border-radius: 12px;
        color: var(--text);
        font-family: var(--font-body);
        font-size: 1rem;
        padding: 0 16px 0 46px;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
        -moz-appearance: textfield;
        appearance: textfield;
      }

      input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }

      input[type="number"]::placeholder { color: #555; }

      input[type="number"]:focus {
        border-color: var(--red);
        box-shadow: 0 0 0 3px rgba(230,51,51,0.15);
      }

      .btn-calculate {
        width: 100%;
        height: 52px;
        background: var(--red);
        color: #fff;
        border: none;
        border-radius: 12px;
        font-family: var(--font-display);
        font-size: 1.2rem;
        letter-spacing: 0.12em;
        cursor: pointer;
        transition: background 0.18s, transform 0.1s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .btn-calculate:hover { background: #c82020; }
      .btn-calculate:active { transform: scale(0.985); }

      .hints {
        display: flex;
        justify-content: center;
        gap: 1.5rem;
        margin-top: 1.5rem;
      }

      .hint {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 0.78rem;
        color: #555;
      }

      .hint-dot {
        width: 6px; height: 6px;
        border-radius: 50%;
        background: var(--red);
        opacity: 0.5;
      }
    </style>
  </head>

  <body>

    <nav>
      <a class="nav-brand" href="/">📽 BingeWise</a>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/about">About</a></li>
        <li><a href="/contact">Contact</a></li>
      </ul>
    </nav>

    <div class="hero-bg"></div>

    <main>
      <div class="calc-card">

        <div class="icon-badge">⏳</div>

        <h1>TIME <span>CALC</span></h1>
        <p>Enter your available hours and discover what you can binge right now.</p>

        <div class="divider"></div>

        <form action="/time_result" method="POST">

          <label class="field-label" for="time-input">Available hours</label>

          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <circle cx="12" cy="12" r="9"/>
              <polyline points="12 7 12 12 15.5 14.5"/>
            </svg>
            <input
              type="number"
              id="time-input"
              name="time"
              step="0.5"
              min="0"
              placeholder="e.g. 1.5"
              required
            >
          </div>

          <button type="submit" class="btn-calculate">
            Find My Watch List
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M5 12h14M13 6l6 6-6 6"/>
            </svg>
          </button>

        </form>

        <div class="hints">
          <div class="hint"><div class="hint-dot"></div> Movies</div>
          <div class="hint"><div class="hint-dot"></div> TV Episodes</div>
          <div class="hint"><div class="hint-dot"></div> Short Films</div>
        </div>

      </div>
    </main>

  </body>
</html>
