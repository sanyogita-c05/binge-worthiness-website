<!doctype html>
<html>
  <head>
    <title>Result</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/global.css') }}"
    />
  </head>

  <body>
    <div id="navbar"></div>

    <section class="result-section">
      <h1>{{ title }}</h1>

      <div class="result-card">
        <h2>🎯 Binge Score: {{ score }}/100</h2>

        <h3>{{ category }}</h3>

        <p>📊 Confidence: {{ confidence }}%</p>
      </div>

      <a href="{{ url_for('score') }}" class="back-btn">⬅ Try Another</a>
    </section>

    <script src="{{ url_for('static', filename='js/navbar.js') }}"></script>
  </body>
</html>
